<style>
/* Layout: reference monitoring page; detail sheet shows 가상계좌 / 증권발행 procedures as numbered steps */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --line:#d9dcd6;
  --fg:#1c211f; --muted:#5f6862; --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --notice:#faf7ff; --notice-line:#e4d9fb; --info:#a689ea; --ok:#2f7a4f; --star:#d29a0c; --plate:#ffffff; --heart:#e5243b; --must:#7b3fe4; --must-bg:#f3edff; --must-line:#cbb5f7; --must-ink:#4b1fa3;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1c2220; --sunk:#252c29; --line:#323a36;
  --fg:#e7ebe8; --muted:#9aa49e; --accent:#7db8e3; --accent-ink:#0e1a22; --accent-soft:#1f3343;
  --notice:#1f1b2a; --notice-line:#3b3156; --info:#8a70d0; --ok:#6fc597; --star:#f0c24b; --plate:#f4f5f3; --heart:#ff4d61; --must:#9b6dff; --must-bg:#251c3a; --must-line:#4a3878; --must-ink:#d8c6ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1c2220; --sunk:#252c29; --line:#323a36;
  --fg:#e7ebe8; --muted:#9aa49e; --accent:#7db8e3; --accent-ink:#0e1a22; --accent-soft:#1f3343;
  --notice:#1f1b2a; --notice-line:#3b3156; --info:#8a70d0; --ok:#6fc597; --star:#f0c24b; --plate:#f4f5f3; --heart:#ff4d61; --must:#9b6dff; --must-bg:#251c3a; --must-line:#4a3878; --must-ink:#d8c6ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;padding-block:6px 14px}
header.top h1,header.top .upd{grid-column:1}
header.top h1{font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
header.top .upd{margin:0;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
header.top .upd b{color:var(--must);font-weight:700}

/* notices */
.notices{display:grid;gap:8px}
.notice{background:var(--notice);border:1px solid var(--notice-line);border-radius:var(--r);overflow:hidden}
.notice > .row{display:flex;gap:10px;align-items:center;padding:12px 14px}
.notice.static .ttl{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.notice > button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.notice .tag{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--fg);color:var(--bg)}
.notice .tag.lite{background:var(--info);color:#fff}
header.top h1,.sheet .hd h2,.contact h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.tab,.copyall,.notice .tag{font-family:var(--font-display);font-weight:600}
.tab[aria-selected="true"]{font-weight:800}
.copyall{font-weight:800}
.notice.must{background:var(--must-bg);border-color:var(--must-line)}
.notice.must .tag{background:var(--must);color:#fff}
.notice.must .ttl{color:var(--must-ink)}
.notice .ttl{flex:1;min-width:0;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice .chev{flex:none;transition:transform .2s;color:var(--muted)}
.notice[aria-expanded="true"] .chev{transform:rotate(180deg)}
.notice[aria-expanded="true"] .ttl{white-space:normal}
.notice .body{padding:0 14px 14px;font-size:.88rem;color:var(--fg)}
.notice .body p{margin:0 0 6px}
.notice .body .date{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* sticky controls */
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;height:46px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);height:100%;outline:none}
.search input::placeholder{color:var(--muted)}
.search .clear{border:0;background:var(--sunk);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .n{margin-left:4px;font-size:.75rem;opacity:.65;font-variant-numeric:tabular-nums}

/* grid */
.meta{font-size:.8rem;color:var(--muted);margin:4px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:340px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{border:1px solid var(--line);background:var(--plate);border-radius:var(--r);padding:12%;aspect-ratio:1;max-width:100%;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0;transition:transform .12s,border-color .12s}
.card{position:relative}
.card:active{transform:scale(.97)}
.cell{position:relative;min-width:0}
.cell .card{width:100%}
.heart{position:absolute;top:3px;right:3px;width:26px;height:26px;border:0;background:transparent;display:grid;place-items:center;color:#9aa19c;border-radius:50%}
.heart svg{width:15px;height:15px}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] svg{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.3)}}
.star-btn{color:var(--muted)}
.star-btn[aria-pressed="true"]{color:var(--heart)}
.card:hover{border-color:var(--accent)}
.mono{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line);padding:6px}
.mono img,.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo{position:absolute;inset:29% 12% 11% 12%;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.logo img{width:auto;height:auto}
.card .nm{font-size:.82rem;font-weight:600;line-height:1.3;word-break:keep-all;min-height:2.6em;display:flex;align-items:center}
.card .ct{font-size:.7rem;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:40px 12px;color:var(--muted);font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet .hd h2{margin:0;font-size:1.1rem;flex:1;min-width:0}
.sheet .hd .sub{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.icon-btn{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.sheet .bd{overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:.7rem;padding:2px 7px;font-family:var(--font-body)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block .bh{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.block .bh strong{flex:1;font-size:.88rem}
.block .kind{font-size:.68rem;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.copy{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-size:.8rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.copy.done{background:var(--ok)}
.block pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--font-body);font-size:.88rem;line-height:1.65;user-select:text}
mark{background:var(--notice-line);color:inherit;border-radius:3px;padding:0 1px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.contact h3{margin:0;font-size:1.05rem}
.contact .hint{margin:4px 0 8px;font-size:.78rem;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rows li:last-child{border-bottom:0}
.lbl{font-weight:600;font-size:.9rem}
.lbl small{font-weight:400;color:var(--muted);font-size:.75rem}
.val{display:flex;align-items:center;gap:10px;justify-content:space-between}
.val a{min-width:0;color:var(--accent);font-weight:600}
.val .tel{display:inline-flex;align-items:center;gap:6px;font-size:1.2rem;font-variant-numeric:tabular-nums}
.val .tel svg{flex:none}
.val .url{font-size:.82rem;overflow-wrap:anywhere;line-height:1.4}
.val .none{color:var(--muted);font-size:.85rem}
.val .mini{flex:none;padding:6px 10px;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--surface)}
.val .mini.done{color:var(--ok);border-color:var(--ok)}
.copyall{width:100%;margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center}
.copyall:disabled{opacity:.4;cursor:default}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:30;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.visits{margin:28px 0 0;text-align:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.visits b{color:var(--fg);font-weight:600;margin-left:3px}
.foot{margin-top:24px;font-size:.75rem;color:var(--muted);text-align:center}

/* tablet & PC */
@media (min-width:640px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
}
@media (min-width:768px){
  .wrap{max-width:960px;padding-block:28px 64px}
  header.top h1{font-size:1.6rem}
  header.top .upd{font-size:.85rem}
  .controls{grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .controls .search{order:2;width:300px}
  .notices{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .notice.must{grid-row:1 / span 2}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
  .heart{top:6px;right:6px}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:480px;max-height:80vh;border-radius:18px;transform:translate(-50%,-46%);opacity:0;transition:transform .2s,opacity .2s;margin:0}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{display:none}
}
@media (min-width:1100px){
  .wrap{max-width:1080px}
  .grid{grid-template-columns:repeat(7,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* procedure blocks */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec > .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sec > .sh h3{margin:0;flex:1;font-family:var(--font-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.sec > .sh .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.way{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.way:last-child{border-bottom:0}
.way .wh{display:flex;align-items:center;gap:8px}
.way .wh strong{flex:1;font-size:.9rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;align-items:center}
.steps li{display:inline-flex;align-items:center;font-size:.86rem;line-height:1.35;word-break:keep-all}
.steps li span{background:var(--sunk);border-radius:7px;padding:4px 8px}
.steps li.hot span{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps li:not(:last-child)::after{content:"→";color:var(--muted);font-weight:600;margin:0 5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--must-bg);color:var(--must-ink);border:1px solid var(--must-line)}
.tip{font-size:.8rem;color:var(--muted);margin:0}
.tip b{color:var(--fg);font-weight:600}
.way .val .tel{font-size:1.15rem}
.sheet .bd{grid-auto-rows:max-content}

</style>
</head>
<body>
<div class="wrap">

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const NOTICES = [
  {tag:"필독", title:"업무 참고용 자료입니다. 처리 전 시스템 화면을 최종 확인해주세요.", date:"2026.11.02",
   body:["메뉴 경로가 바뀌었거나 오류가 있으면 이보람 총무에게 카톡 남겨주세요."]},
  {tag:"안내", title:"가상계좌 사용기간은 회사마다 다릅니다 (한 달 / 1년 / 고정).", date:"2026.11.02", body:[]}
];

const CATS = [

  {id:"fav",label:"즐겨찾기"},

const SECTIONS = [{key:"va",label:"가상계좌"},{key:"cert",label:"증권발행"}];

/* 회사별 처리 방법.
   way.steps : 시스템 메뉴 경로 (" > "로 구분)

   way.pill  : 사용기간 등 강조 표시
   way.tip   : 보충 설명 */
const DETAIL = [
 /* ── 손해보험 ── */
 {id:"db-f", alias:"디비손보 디비손해 db손보",
  va:[
   {label:"단건", pill:"한 달 사용 가능",
    steps:"장기 > 계약조회 > 장기계약조회 > 증권번호 입력 > 조회 > 관련화면바로가기 > 계속분입금/부활 > 입금건수 (두 달치는 2로 변경) > 보험료산출 > 입금처리 > 가상계좌 체크 > 부여은행 선택 > 계좌부여"},
   {label:"다건", pill:"한 달 사용 가능",
    steps:"장기 > 계약유지 > 입금/취소처리 > 계속보험료일괄영수처리 > 취급자정보 확인 > 입금구분 (당월/연체 선택) > 보험료산출 > 입금처리 > 가상계좌 탭 클릭 > 부여은행 선택 > 계좌부여"},
   {label:"신용카드 납입", tip:"<b>가상계좌</b> 대신 <b>신용카드</b>를 선택해서 같은 순서로 진행"}
  ],
  cert:[{label:"증권 발행", tip:"재발급사유가 나오면 <b>PDF 저장 후 출력</b>",
    steps:"장기 > 계약조회 > 장기계약조회 > 증권번호 입력 > 조회 > 관련화면바로가기 > 증권발급 > 발송/출력"}]},

if(!CATS.some(c=>c.id===cat)) cat="all";
const saveFavs = () => { try{ localStorage.setItem("va-favs",JSON.stringify([...favs])); }catch(e){} };
const STAR = on => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.1 4.5c2 0 3.5 1.1 4.9 2.9 1.4-1.8 2.9-2.9 4.9-2.9 3.5 0 5.7 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>`;
const TEL = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;
function toggleFav(id){
  const on=!favs.has(id);
  on ? favs.add(id) : favs.delete(id);
  saveFavs(); render(); if(current && current.id===id && !$("#sheet").hidden) paintFav();
  toast(on?"즐겨찾기에 추가했습니다":"즐겨찾기에서 뺐습니다");
}
const inCat = (it,c) => c==="all" ? true : c==="fav" ? favs.has(it.id) : it.cat===c;

/* notices */
$("#notices").innerHTML = NOTICES.map((n,i)=> !n.body.length ? `
  <div class="notice static">
    <div class="row"><span class="tag lite">${n.tag}</span><span class="ttl">${esc(n.title)}</span></div>
  </div>` : `
  <div class="notice ${n.tag==="필독"?"must":""}" aria-expanded="${i===0}">
    <button type="button" aria-controls="nb${i}" aria-expanded="${i===0}">
      <span class="tag ${n.tag==="필독"?"":"lite"}">${n.tag}</span>
      <span class="ttl">${esc(n.title)}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="body" id="nb${i}" ${i===0?"":"hidden"}>
      ${n.body.map(p=>`<p>${esc(p)}</p>`).join("")}
      <span class="date">${n.date}</span>
    </div>
  </div>`).join("");
$("#notices").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const box=b.parentElement, open=box.getAttribute("aria-expanded")!=="true";
  box.setAttribute("aria-expanded",open); b.setAttribute("aria-expanded",open);
  box.querySelector(".body").hidden=!open;
});

/* filtering */
const match = it => inCat(it,cat) && (!q || hay(it).includes(q.toLowerCase()));
function renderTabs(){
  const base = ITEMS.filter(it=>!q || hay(it).includes(q.toLowerCase()));
  $("#tabs").innerHTML = CATS.map(c=>{
    const n = base.filter(i=>inCat(i,c.id)).length;
    return `<button class="tab" role="tab" data-c="${c.id}" aria-selected="${c.id===cat}">${c.label}<span class="n">${n}</span></button>`;
  }).join("");
}
function renderGrid(){
  const list = ITEMS.filter(match);
  const label = CATS.find(c=>c.id===cat).label;
  $("#meta").textContent = q ? `'${q}' 검색 결과 ${list.length}건` : `${label==="전체"?"전체 보험사":label+(cat==="fav"?"":"사")} ${list.length}곳`;
  const emptyMsg = cat==="fav" && !q
    ? `즐겨찾기한 보험사가 없습니다.<br>카드의 ♡를 눌러 추가하세요.`
    : `검색 결과가 없습니다.<br>다른 단어로 찾아보거나 '전체' 탭을 눌러보세요.`;
  $("#grid").innerHTML = list.length ? list.map(it=>`
    <div class="cell">
      <button class="card" type="button" data-id="${it.id}" aria-label="${esc(it.name)} 처리 방법 보기">
        <span class="logo"><img src="${LOGOS[it.id]}" alt="${esc(it.name)}" loading="lazy"></span>
      </button>
      <button class="heart" type="button" data-fav="${it.id}" aria-pressed="${favs.has(it.id)}" aria-label="${esc(it.name)} 즐겨찾기${favs.has(it.id)?" 해제":" 추가"}">${STAR(favs.has(it.id))}</button>
    </div>`).join("")
    : `<div class="empty">${emptyMsg}</div>`;
}
function render(){ renderTabs(); renderGrid(); }

$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  cat=t.dataset.c; try{localStorage.setItem("va-cat",cat)}catch(e){}
  render(); t.scrollIntoView({inline:"nearest",block:"nearest"});
});
$("#q").addEventListener("input",e=>{ q=e.target.value.trim(); $("#clear").hidden=!q; render(); });
$("#clear").addEventListener("click",()=>{ $("#q").value=""; q=""; $("#clear").hidden=true; render(); $("#q").focus(); });

/* copy */
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1600); }
function fallbackSelect(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
async function copyText(text, btn, selEl){
  try{ await navigator.clipboard.writeText(text); toast("복사했습니다");
    if(btn){ const o=btn.innerHTML; btn.classList.add("done"); btn.textContent="복사됨"; setTimeout(()=>{btn.classList.remove("done"); btn.innerHTML=o;},1400); }
  }catch(e){ if(selEl) fallbackSelect(selEl); toast("텍스트를 선택했어요. 길게 눌러 복사하세요"); }
}
const wayText = w => [
  `▶ ${w.label}${w.pill?` (${w.pill})`:""}`,
  w.tel ? `📞 ${w.tel}` : "",
  w.url ? `🔗 ${w.url}` : "",
  w.steps ? stepsOf(w).join(" → ") : "",
  w.tip ? `※ ${stripTags(w.tip)}` : ""
].filter(Boolean).join("\n");
const secText = (it,s) => `[${it.name}] ${s.label}\n` + it[s.key].map(wayText).join("\n\n");

/* sheet */
const hl = s => { const e=esc(s); if(!q) return e; const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return e.replace(new RegExp(qe,"gi"),m=>`<mark>${m}</mark>`); };
const HOT = /(발급|부여|발행|발행하기|출력|입금처리|발송|전송|채번|저장|신청 클릭|납입대상확정|입금생성 버튼 클릭)$/;
let current=null, lastFocus=null;
function wayHtml(w, sk, i){
  const steps = stepsOf(w);
  return `<div class="way" id="w-${sk}-${i}">
    <div class="wh"><strong>${esc(w.label)}</strong>${w.pill?`<span class="pill">${esc(w.pill)}</span>`:""}</div>
    ${w.tel?`<div class="val"><a class="tel" href="tel:${w.tel.replace(/[^0-9]/g,"")}">${TEL}<span>${hl(w.tel)}</span></a></div>`:""}
    ${w.url?`<div class="val"><a class="url" href="${esc(w.url)}" target="_blank" rel="noopener">${hl(w.url)}</a></div>`:""}
    ${steps.length?`<ol class="steps">${steps.map(s=>`<li class="${HOT.test(s)?"hot":""}"><span>${hl(s)}</span></li>`).join("")}</ol>`:""}
    ${w.tip?`<p class="tip">※ ${w.tip}</p>`:""}${w.todo?`<p class="tip">시스템 처리 방법이 아직 등록되지 않았어요.</p>`:""}
  </div>`;
}
function openSheet(id){
  current = ITEMS.find(i=>i.id===id); if(!current) return;
  lastFocus=document.activeElement;
  $("#sMono").innerHTML=`<img src="${LOGOS[current.id]}" alt="">`;
  paintFav();
  $("#sTitle").innerHTML=`${esc(current.name)}<span class="sub">${CATS.find(c=>c.id===current.cat).label}</span>`;
  $("#sBody").innerHTML = SECTIONS.map((s,si)=>`
    <section class="sec" id="s-${s.key}">
      <div class="sh"><span class="num">${si+1}</span><h3>${s.label}</h3>
        <button class="copy" type="button" data-s="${s.key}">복사</button></div>
      ${current[s.key].map((w,i)=>wayHtml(w,s.key,i)).join("")}
    </section>`).join("") + `
    <button class="copyall" type="button" id="copyAll">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg>
      전체내용복사</button>`;
  $("#scrim").hidden=false; $("#sheet").hidden=false;
  requestAnimationFrame(()=>{ $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sClose").focus(); });
  document.body.style.overflow="hidden";
}
function closeSheet(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow="";
  setTimeout(()=>{ $("#scrim").hidden=true; $("#sheet").hidden=true; },250);
  if(lastFocus) lastFocus.focus();
}
$("#grid").addEventListener("click",e=>{ const h=e.target.closest(".heart"); if(h){ toggleFav(h.dataset.fav); return; } const c=e.target.closest(".card"); if(c) openSheet(c.dataset.id); });
function paintFav(){
  const on=favs.has(current.id), b=$("#sFav");
  b.innerHTML=STAR(on); b.setAttribute("aria-pressed",on);
  b.setAttribute("aria-label",on?"즐겨찾기 해제":"즐겨찾기 추가");
}
$("#sFav").addEventListener("click",()=>{ if(current) toggleFav(current.id); });
$("#scrim").addEventListener("click",closeSheet);
$("#sClose").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
$("#sBody").addEventListener("click",e=>{
  const w=e.target.closest("[data-w]");
  if(w){ const [sk,i]=w.dataset.w.split(":"); const s=SECTIONS.find(x=>x.key===sk);
    copyText(`[${current.name}] ${s.label}\n`+wayText(current[sk][+i]),w,$(`#w-${sk}-${i}`)); return; }
  const s=e.target.closest("[data-s]");
  if(s){ copyText(secText(current,SECTIONS.find(x=>x.key===s.dataset.s)),s,$(`#s-${s.dataset.s}`)); return; }
  if(e.target.closest("#copyAll")) copyText(SECTIONS.map(x=>secText(current,x)).join("\n\n"),null,$("#sBody"));
});
/* swipe down to close */
let y0=null;
$("#sheet").addEventListener("touchstart",e=>{ if($("#sBody").scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
$("#sheet").addEventListener("touchend",e=>{ if(y0!==null && e.changedTouches[0].clientY-y0>90) closeSheet(); y0=null; });

render();

/* visitor counter (GoatCounter, counted per page path) */
(function(){
  const code = window.GC_CODE; if(!code) return;
  $("#visits").hidden = false;
  const url = p => "https://"+code+".goatcounter.com/counter/"+encodeURIComponent(p)+".json";
  const pn = location.pathname;
  const paths = [...new Set([pn, pn.replace(/\/+$/,"")||"/", pn.replace(/\/*$/,"/")])];
  setTimeout(async()=>{
    for(const p of paths){
      try{ const r=await fetch(url(p)); if(!r.ok) continue; $("#vTotal").textContent=(await r.json()).count; return; }catch(e){}
    }
  },1500);
})();
</script>
</body>
</html>
